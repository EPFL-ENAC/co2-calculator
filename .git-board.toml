[repos]
list = ["EPFL-ENAC/co2-calculator", "EPFL-ENAC/co2-calculator-back-office-doc"]

[fields.status]
single = true
options = ["backlog", "comite", "ready", "in-progress", "in-review", "ready-for-validation", "qa", "tests-metier", "validated"]
# Project 40's names where their slug isn't the value
project = { comite = "Comité Spécialisé", qa = "QA Validation" }

[fields.prio]
single = true
options = ["p0", "p1", "p2", "p3"]

[fields.est]
single = true
options = ["0.5", "1", "2", "3", "4", "6", "8", "16"]
numeric = true

[fields.assignee]
single = false

[sprints]
length_days = 14
start_weekday = "monday"

# Project 40's iterations: their dates are what sprint:@current/@next use.
# A sprint missing here still gets its label (its title as a slug); add it
# here for @current to find it.
