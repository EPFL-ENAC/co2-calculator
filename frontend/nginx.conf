worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # The stock mime.types has no .mjs entry, so ES-module workers fell back to
  # application/octet-stream: browsers refuse them and gzip skipped them.
  types { application/javascript mjs; }

  # Define log format
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Basic settings
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Comprehensive gzip configuration
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.0;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/x-javascript
    text/xml
    application/xml
    application/xml+rss
    application/json
    application/vnd.ms-fontobject
    application/font-woff
    application/x-font-ttf
    image/svg+xml;

  server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Health endpoints
    # -------------------------------------------------------------------------

    location = /healthz {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    location = /ready {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    location = /health {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # Runtime configuration
    # -------------------------------------------------------------------------

    # Runtime config injected at container startup by
    # /docker-entrypoint.d/40-inject-env.sh.
    #
    # Lives in /tmp because the html directory is read-only under our
    # Kubernetes securityContext.
    #
    # Exact-match location takes precedence over the regex locations below.
    location = /injectEnv.js {
      alias /tmp/injectEnv.js;
      default_type application/javascript;
      expires -1;
      add_header Pragma "no-cache, must-revalidate";
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # HTML and service workers
    # -------------------------------------------------------------------------

    # HTML and service workers must always be revalidated so that deployments
    # are picked up immediately.
    location ~* (\.html|\/sw\.js)$ {
      expires -1;
      add_header Pragma "no-cache, must-revalidate";
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # Source maps
    # -------------------------------------------------------------------------

    # Source maps are shipped inside the image for the GlitchTip upload step
    # in CI, but are never served to public traffic.
    location ~* \.map$ {
      access_log off;
      return 404;
    }

    # -------------------------------------------------------------------------
    # Hashed static assets
    # -------------------------------------------------------------------------

    # Vite content-hashed assets are safe to cache for a year because a
    # changed file gets a new URL.
    #
    # Examples:
    #   app-BJqgGX1f.js
    #   CompareYearsDialog-C-oRLJOm.js
    #   maplibre-gl-worker-BJqgGX1f.mjs
    #
    # The hash is exactly 8 base64url chars, which can include "-" and "_".
    # Keep the count exact: an open-ended {8,} would also match the unhashed
    # maplibre-gl-shared.mjs through "-gl-shared".
    #
    # This regex must come BEFORE the generic JS/CSS/MJS location below:
    # nginx evaluates regex locations in configuration order and uses the
    # first matching regex location.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|mjs|css)$" {
      access_log off;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Non-hashed JavaScript / CSS / ES modules
    # -------------------------------------------------------------------------

    # Non-hashed resources (e.g. maplibre-gl-shared.mjs, copied unhashed by
    # quasar.config.js afterBuild) can change while keeping the same URL, so
    # they must be revalidated on subsequent requests.
    #
    # `no-cache` still allows the browser to store the response, but requires
    # validation before reuse (typically resulting in a cheap 304 response).
    location ~* \.(js|mjs|css)$ {
      access_log off;
      expires -1;
      add_header Pragma "no-cache, must-revalidate";
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Other static assets
    # -------------------------------------------------------------------------

    # Other static assets that are not covered by the hashed JS/CSS/MJS rule.
    location ~* \.(json|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf)$ {
      access_log off;
      expires 365d;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Clean URLs
    # -------------------------------------------------------------------------

    # Remove trailing slashes.
    location ~ ^(.+)/$ {
      return 301 $1$is_args$args;
    }

    # -------------------------------------------------------------------------
    # SPA fallback
    # -------------------------------------------------------------------------

    # Try the requested file, then directory, then fall back to index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # For server errors, also fallback to index.html (SPA behavior).
    error_page 404 500 502 503 504 /index.html;
  }
}
