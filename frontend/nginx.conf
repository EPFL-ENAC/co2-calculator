worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # The stock mime.types has neither .mjs nor .csv, so both fell back to
  # application/octet-stream: browsers refuse module workers served that way,
  # and gzip skipped them.
  types {
    application/javascript mjs;
    text/csv csv;
  }

  # Define log format
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Basic settings
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  # Keep the nginx version out of the Server header and error pages.
  server_tokens off;

  # The image carries a .gz (gzip 9) and a .br (brotli 11) file next to each
  # text file (build/precompress.mjs): nginx sends them as they are, with no
  # CPU spent per request. `gzip on` below covers what has none: /tmp files.
  gzip_static on;

  # No brotli module in the image: a client that accepts br is rewritten to
  # the .br file (see the server block). br;q=0 means "not br". volatile:
  # nginx would otherwise keep the first value, from before an internal
  # redirect to /index.html.
  map $http_accept_encoding $br_accepted {
    volatile;
    default "";
    "~*\bbr\s*;\s*q=0(\.0*)?\s*(,|$)" "";
    "~*\bbr\b" "$request_filename.br";
  }
  # The files written at startup in /tmp have no .br: never look for one in
  # the html root, where a stale copy would shadow them.
  map $uri $br_file {
    volatile;
    default $br_accepted;
    "~^/(injectEnv\.js|theme\.css|favicon\.ico|offnet\.html|institution/)" "";
  }
  # Same cache classes as the plain locations: hashed for a year, the rest
  # revalidated.
  map $uri $br_cache_control {
    default "no-cache, must-revalidate";
    "~*-[A-Za-z0-9_-]{8}\.(js|mjs|css|json|svg|csv)\.br$" "public, max-age=31536000, immutable";
  }
  # A versioned institution font (font-bold.<checksum>.woff2, written by
  # 40-entrypoint.sh, named in theme.css) never changes content, so browsers
  # keep it one year. Every fixed name stays revalidated.
  map $uri $institution_cache_control {
    default "no-cache, must-revalidate";
    "~^/institution/font-[a-z]+\.[0-9]+\.woff2$" "public, max-age=31536000, immutable";
  }
  map $uri $br_pragma {
    default "no-cache, must-revalidate";
    "~*-[A-Za-z0-9_-]{8}\.(js|mjs|css|json|svg|csv)\.br$" "";
  }

  # Clients outside the allowed networks get /offnet.html (#3196). The
  # router only sees the load balancer, so the client is the right-most
  # X-Forwarded-For address that is not a trusted proxy: a forged header
  # does not pass. The image file allows every client. The chart mounts the
  # real list (proxies, then "<cidr> 0;" lines over a "1" default).
  geo $client_outside {
    default 0;
    include /etc/nginx/client-allowlist/geo.conf;
  }
  # The kubelet calls the pod directly, so its probe has no X-Forwarded-For.
  # The router and the load balancer always add the header: a probe path
  # stays closed to every client that comes through them.
  map $http_x_forwarded_for $direct_request {
    default 0;
    "" 1;
  }
  # The page is one self-contained file, so an outside client gets nothing
  # else. volatile: the error_page redirect to /offnet.html must see the new
  # $uri, not the cached value.
  map $uri $offnet_exempt {
    volatile;
    default 0;
    /offnet.html 1;
    /healthz $direct_request;
    /ready $direct_request;
    /health $direct_request;
  }
  map "$client_outside$offnet_exempt" $send_offnet {
    volatile;
    default 0;
    10 1;
  }

  # Comprehensive gzip configuration
  gzip on;
  gzip_disable "msie6";
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.0;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/csv
    text/javascript
    application/javascript
    application/x-javascript
    text/xml
    application/xml
    application/xml+rss
    application/json
    application/vnd.ms-fontobject
    application/font-woff
    application/x-font-ttf
    image/svg+xml;

  server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------

    # HSTS is not here: the load balancer already sends it. `merge` keeps
    # these on the locations below that add their own headers, where nginx
    # would otherwise drop every server-level one.
    #
    # The CSP stops at framing, <base> and plugins. A script-src policy has to
    # list the font, map-tile, analytics and GlitchTip hosts, the last of which
    # differs per environment.
    add_header_inherit merge;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # -------------------------------------------------------------------------
    # Clients outside the allowed networks
    # -------------------------------------------------------------------------

    # Before the brotli rewrite, so no other file is reached. error_page
    # sends /offnet.html with the 403: the browser revalidates index.html
    # (no-cache), so a client that left the network gets the page on the
    # next load.
    if ($send_offnet) {
      return 403;
    }
    error_page 403 /offnet.html;

    # The page of the institution, or the neutral default of the image:
    # 40-entrypoint.sh copies it with the other assets. Not served through
    # /institution/, whose sandbox CSP stops its inline script. always: the
    # page goes out with the 403 status.
    location = /offnet.html {
      alias /tmp/institution/offnet.html;
      default_type text/html;
      add_header Pragma "no-cache, must-revalidate" always;
      add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # -------------------------------------------------------------------------
    # Brotli negotiation
    # -------------------------------------------------------------------------

    # A file with a .br next to it, for a client that accepts br, becomes an
    # internal rewrite to that .br, before the location is chosen. The HTML
    # location repeats it for the internal redirects to /index.html.
    if (-f $br_file) {
      rewrite ^ $uri.br last;
    }

    # Only reached through the rewrite above: a direct request gets a 404.
    # The type is the one of the original file, never octet-stream: with
    # nosniff the browser refuses a module script of the wrong type. gzip off
    # so the body is not encoded twice.
    location ~ \.br$ {
      internal;
      access_log off;
      gzip off;
      gzip_static off;
      # always: error_page serves /index.html.br with the 404 status, and
      # without Content-Encoding the browser shows the compressed bytes.
      add_header Content-Encoding br always;
      add_header Vary Accept-Encoding always;
      add_header Pragma $br_pragma always;
      add_header Cache-Control $br_cache_control always;
      location ~ \.m?js\.br$ { types { application/javascript br; } }
      location ~ \.css\.br$ { types { text/css br; } }
      location ~ \.html\.br$ { types { text/html br; } }
      location ~ \.json\.br$ { types { application/json br; } }
      location ~ \.svg\.br$ { types { image/svg+xml br; } }
      location ~ \.csv\.br$ { types { text/csv br; } }
    }

    # -------------------------------------------------------------------------
    # Health endpoints
    # -------------------------------------------------------------------------

    location = /healthz {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    location = /ready {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    location = /health {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    # -------------------------------------------------------------------------
    # Runtime configuration
    # -------------------------------------------------------------------------

    # Runtime config injected at container startup by
    # /docker-entrypoint.d/40-entrypoint.sh.
    #
    # Lives in /tmp because the html directory is read-only under our
    # Kubernetes securityContext.
    #
    # Exact-match location takes precedence over the regex locations below.
    location = /injectEnv.js {
      alias /tmp/injectEnv.js;
      default_type application/javascript;
      add_header Pragma "no-cache, must-revalidate";
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # Institution theme, written at startup from its theme.conf by
    # /docker-entrypoint.d/40-entrypoint.sh (#3244). /tmp for the same
    # read-only reason as injectEnv.js.
    location = /theme.css {
      alias /tmp/theme.css;
      default_type text/css;
      add_header Pragma "no-cache, must-revalidate";
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # Institution assets
    # -------------------------------------------------------------------------

    # Logo, browser icons, login illustration and fonts of the institution
    # (#3244). 40-entrypoint.sh copies the defaults of the image and the
    # files of the mounted folder to /tmp/institution at startup. The fixed
    # names are revalidated; the versioned fonts are kept one year (see
    # $institution_cache_control). ^~ keeps the regex cache locations below
    # from matching these paths.
    #
    # The second CSP is for a file opened as a page: an SVG of the
    # institution must not run script in the origin of the app. It does not
    # touch the logo as an image or the fonts.
    location ^~ /institution/ {
      alias /tmp/institution/;
      add_header Cache-Control $institution_cache_control;
      add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    }

    # Clients that probe the bare path without reading index.html.
    location = /favicon.ico {
      access_log off;
      alias /tmp/institution/favicon.ico;
      # Revalidated like /institution/: a new institution icon shows at once.
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # HTML and service workers
    # -------------------------------------------------------------------------

    # HTML and service workers must always be revalidated so that deployments
    # are picked up immediately.
    location ~* (\.html|\/sw\.js)$ {
      # An internal redirect to /index.html (index, SPA fallback, error_page)
      # skips the server-level rewrite: repeat the .br check here.
      if (-f $br_file) {
        rewrite ^ $uri.br last;
      }
      add_header Pragma "no-cache, must-revalidate";
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # Source maps
    # -------------------------------------------------------------------------

    # Source maps are shipped inside the image for the GlitchTip upload step
    # in CI, but are never served to public traffic.
    location ~* \.map$ {
      access_log off;
      return 404;
    }

    # -------------------------------------------------------------------------
    # Hashed static assets
    # -------------------------------------------------------------------------

    # Vite content-hashed assets are safe to cache for a year because a
    # changed file gets a new URL.
    #
    # Examples:
    #   app-BJqgGX1f.js
    #   CompareYearsDialog-C-oRLJOm.js
    #   maplibre-gl-worker--Gq8GU9j.js
    #
    # The hash is exactly 8 base64url chars, which can include "-" and "_".
    # Keep the count exact: an open-ended {8,} would also match unhashed names
    # such as maplibre-gl-shared.mjs through "-gl-shared". The regex is quoted
    # because nginx otherwise reads the braces as a block.
    #
    # This regex must come BEFORE the unhashed rule below: nginx evaluates
    # regex locations in configuration order and uses the first match.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|mjs|css|json|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf|csv)$" {
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Unhashed static assets
    # -------------------------------------------------------------------------

    # Anything shipped under the same URL across deploys (CSV templates, any
    # future unhashed copy) must be
    # revalidated: a replaced file would otherwise stay stale in browsers for
    # as long as the previous rule promised.
    #
    # `no-cache` still allows the browser to store the response, but requires
    # validation before reuse (typically resulting in a cheap 304 response).
    location ~* \.(js|mjs|css|json|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf|csv)$ {
      access_log off;
      add_header Pragma "no-cache, must-revalidate";
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Clean URLs
    # -------------------------------------------------------------------------

    # Remove trailing slashes.
    location ~ ^(.+)/$ {
      return 301 $1$is_args$args;
    }

    # -------------------------------------------------------------------------
    # SPA fallback
    # -------------------------------------------------------------------------

    # Try the requested file, then directory, then fall back to index.html.
    location / {
      try_files $uri $uri/ /index.html;
    }

    # For server errors, also fallback to index.html (SPA behavior).
    error_page 404 500 502 503 504 /index.html;
  }
}
