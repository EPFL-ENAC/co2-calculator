<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <!--
      Browser icons and theme come from the institution folder that the
      container builds at startup from its defaults and the mounted folder
      (#3244). nginx serves it as is, so these URLs stay unhashed. The fonts
      are not preloaded: theme.conf can point them at another server, so
      their URLs are only known in theme.css.
      Without the apple-touch-icon link Safari probes two root icon URLs
      that 404.
    -->
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="/institution/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/institution/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/institution/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/institution/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="/institution/favicon.ico" />
    <link rel="apple-touch-icon" href="/institution/favicon-128x128.png" />
    <!--
      Colors, corner radii and fonts of the institution, written at
      container startup from its theme.conf by docker/institution.sh.
    -->
    <link rel="stylesheet" href="/theme.css" />

    <!--
      Runtime config. In production this file is overwritten by
      docker/entrypoint.sh on container startup with the per-env values
      (Sentry DSN, environment, etc.). defer (not sync) keeps it off the
      render-blocking path while still running before the app's module
      bundle, so window.injectedEnvVariable is populated before
      src/boot/sentry.ts runs.
    -->
    <script src="/injectEnv.js" defer></script>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
