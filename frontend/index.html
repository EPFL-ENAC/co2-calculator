<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <!--
      Institution assets (#500): the folder is mounted into the container at
      /institution/ (see docker/check-institution-assets.sh). The bundle ships
      no logo, icon or font of its own. The apple-touch-icon link also stops
      Safari from probing two missing files at the site root.
    -->
    <link rel="icon" type="image/x-icon" href="/institution/favicon.ico" />
    <link rel="apple-touch-icon" href="/institution/apple-touch-icon.png" />
    <link rel="stylesheet" href="/institution/fonts.css" />

    <!--
      Runtime config. In production this file is overwritten by
      docker/entrypoint.sh on container startup with the per-env values
      (Sentry DSN, environment, etc.). defer (not sync) keeps it off the
      render-blocking path while still running before the app's module
      bundle, so window.injectedEnvVariable is populated before
      src/boot/sentry.ts runs.
    -->
    <script src="/injectEnv.js" defer></script>
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
