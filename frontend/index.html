<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <!--
      Browser icons and theme come from the institution folder that the
      container builds at startup from its defaults and the mounted folder
      (#3244). nginx serves it as is, so these URLs stay unhashed. The fonts
      are not preloaded: theme.conf can point them at another server, so
      their URLs are only known in theme.css.
      Without the apple-touch-icon link Safari probes two root icon URLs
      that 404.
    -->
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="/institution/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/institution/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/institution/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/institution/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="/institution/favicon.ico" />
    <link rel="apple-touch-icon" href="/institution/favicon-128x128.png" />
    <!--
      Colors, corner radii and fonts of the institution, written at
      container startup from its theme.conf by docker/entrypoint.sh.
    -->
    <link rel="stylesheet" href="/theme.css" />

    <!--
      Runtime config. In production this file is overwritten by
      docker/entrypoint.sh on container startup with the per-env values
      (Sentry DSN, environment, etc.). defer (not sync) keeps it off the
      render-blocking path while still running before the app's module
      bundle, so window.injectedEnvVariable is populated before
      src/boot/sentry.ts runs.
    -->
    <script src="/injectEnv.js" defer></script>

    <!--
      First frame of the login page: its title as text, painted from this
      file before the JavaScript runs. Shown only while #q-app is empty, so
      the mounted app removes it without a script; fixed, so it moves nothing.
      One step larger than the title of the login card (1.5rem): the largest
      paint must stay this text, not the logo that the app draws later.
      The font stack is $tokens-typography-font-family-base.
    -->
    <style>
      #shell {
        display: none;
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font:
          500 1.75rem InstitutionFont,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #q-app:empty ~ #shell {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- quasar:entry-point -->
    <!--
      aria-hidden: the login card says the same title a moment later. The
      text is login_title of src/i18n/login.ts, given by quasar.config.js.
      Only the login route shows it, in the language of the URL: this file
      cannot know the cookie rules of the app, and the product name on a
      page of a logged-in user would be a flash. Other pages start blank.
    -->
    <div id="shell" aria-hidden="true"></div>
    <script>
      (function (titles) {
        var languages = Object.keys(titles).join('|');
        var match = new RegExp('^/(' + languages + ')/login$').exec(
          location.pathname,
        );
        if (match) {
          document.getElementById('shell').textContent = titles[match[1]];
        }
      })(<%= loginTitleJson %>);
    </script>
  </body>
</html>
