# The app chart on a laptop cluster (Docker Desktop, kind, minikube):
# the test login, plain http, and Traefik in front, as in Docker Compose.
backend:
  replicaCount: 1
  existingSecret:
    name: co2-backend
  env:
    # Enables the test login. Never on a shared cluster.
    DEBUG: "true"
    # Skaffold is not LOCAL_ENVIRONMENT: boot refuses DEBUG without this opt-in.
    ALLOW_DEBUG_DEPLOYMENT: "true"
    COOKIE_SECURE: "false"
    FRONTEND_URL: "http://localhost:8090"
    # The root filesystem is read-only; /tmp is the writable emptyDir.
    FILES_STORAGE_PATH: "/tmp/files_storage"
  connector:
    allowedHostSuffixes: "localhost"
  podDisruptionBudget:
    enabled: false
frontend:
  replicaCount: 1
  env:
    # Adds the /login-test page. "development" is the GlitchTip label of
    # local runs, apart from the deployed "dev".
    APP_ENVIRONMENT: development
  # The example institution of frontend/institution-example, as the
  # ConfigMap that skaffold/templates/institution.yaml makes.
  institutionAssets:
    volume:
      configMap:
        name: co2-institution
  podDisruptionBudget:
    enabled: false
database:
  existingSecret:
    name: co2-db
docs:
  enabled: false
# Same split as the OpenShift Routes: /api to the backend, unchanged.
ingress:
  className: traefik
  # The chart's nginx annotations stay: Traefik ignores them. null breaks
  # the render, because the template calls hasKey on this map.
  hosts:
    - host: localhost
      paths:
        - { path: /api, pathType: Prefix, backend: backend }
        - { path: /, pathType: Prefix, backend: frontend }
