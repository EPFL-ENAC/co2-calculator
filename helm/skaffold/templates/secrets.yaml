# The two Secrets of examples/secrets.yaml, filled with local-only values.
# They pass the startup check of the backend, as real values must.
# The keys must match examples/secrets.yaml: make -C helm lint checks it.
apiVersion: v1
kind: Secret
metadata:
  name: co2-db
type: Opaque
stringData:
  DB_URL: "postgresql://co2_user:co2_password@co2-postgres:5432/co2_calculator?sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: co2-backend
type: Opaque
stringData:
  JWT_HMAC_KEY: "local-skaffold-only-jwt-signing-key"
  SESSION_HMAC_KEY: "local-skaffold-only-session-signing-key"
  OAUTH_CLIENT_ID: ""
  OAUTH_CLIENT_SECRET: ""
  OAUTH_ISSUER_URL: ""
  OAUTH_TENANT_ID: ""
  CREDENTIALS_ENCRYPTION_KEY: "local-skaffold-only-credentials-key"
  CREDENTIALS_ENCRYPTION_SALT: "local-skaffold-only-salt"
  S3_ENDPOINT_PROTOCOL: "https"
  S3_ENDPOINT_HOSTNAME: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_REGION: ""
  S3_BUCKET: ""
  S3_PATH_PREFIX: ""
  FILES_MAX_SIZE_MB: "100"
  FILES_ENCRYPTION_KEY: "local-skaffold-only-files-key"
  FILES_ENCRYPTION_SALT: "local-skaffold-only-salt"
  ACCRED_API_BASE_URL: ""
  ACCRED_API_USERNAME: ""
  ACCRED_API_KEY: ""
  ELASTICSEARCH_HOSTS: "https://localhost:9200"
  ELASTICSEARCH_INDEX: "UNDEFINED_INDEX"
  ELASTICSEARCH_ID: ""
  ELASTICSEARCH_API_KEY: ""
  ELASTICSEARCH_CA_CERT_FILE: ""
