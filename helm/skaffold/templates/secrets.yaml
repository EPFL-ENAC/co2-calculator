# The two Secrets of examples/secrets.yaml, with local-only values. Helm
# generates the signing and encryption values on the first install and keeps
# them on upgrades. The keys must match examples/secrets.yaml (make -C helm lint).
{{- $data := (lookup "v1" "Secret" .Release.Namespace "co2-backend").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: co2-db
type: Opaque
stringData:
  DB_URL: "postgresql://co2_user:co2_password@co2-postgres:5432/co2_calculator?sslmode=disable"
---
apiVersion: v1
kind: Secret
metadata:
  name: co2-backend
type: Opaque
stringData:
  JWT_HMAC_KEY: {{ get $data "JWT_HMAC_KEY" | b64dec | default (randAlphaNum 48) | quote }}
  SESSION_HMAC_KEY: {{ get $data "SESSION_HMAC_KEY" | b64dec | default (randAlphaNum 48) | quote }}
  OAUTH_CLIENT_ID: ""
  OAUTH_CLIENT_SECRET: ""
  OAUTH_ISSUER_URL: ""
  OAUTH_TENANT_ID: ""
  CREDENTIALS_ENCRYPTION_KEY: {{ get $data "CREDENTIALS_ENCRYPTION_KEY" | b64dec | default (randAlphaNum 48) | quote }}
  CREDENTIALS_ENCRYPTION_SALT: {{ get $data "CREDENTIALS_ENCRYPTION_SALT" | b64dec | default (randAlphaNum 48) | quote }}
  S3_ENDPOINT_PROTOCOL: "https"
  S3_ENDPOINT_HOSTNAME: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_REGION: ""
  S3_BUCKET: ""
  S3_PATH_PREFIX: ""
  FILES_MAX_SIZE_MB: "100"
  FILES_ENCRYPTION_KEY: {{ get $data "FILES_ENCRYPTION_KEY" | b64dec | default (randAlphaNum 48) | quote }}
  FILES_ENCRYPTION_SALT: {{ get $data "FILES_ENCRYPTION_SALT" | b64dec | default (randAlphaNum 48) | quote }}
  ACCRED_API_BASE_URL: ""
  ACCRED_API_USERNAME: ""
  ACCRED_API_KEY: ""
  ELASTICSEARCH_HOSTS: "https://localhost:9200"
  ELASTICSEARCH_INDEX: "UNDEFINED_INDEX"
  ELASTICSEARCH_ID: ""
  ELASTICSEARCH_API_KEY: ""
  ELASTICSEARCH_CA_CERT_FILE: ""
