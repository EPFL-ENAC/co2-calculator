# Default values for the CO2 Calculator chart.
# Override these values using a custom values file or --set flags during helm install/upgrade.

nameOverride: ""
fullnameOverride: ""

global:
  imagePullSecrets: []
  # - name: ghcr-creds

backend:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/epfl-enac/epfl/co2-calculator/backend
    tag: "latest"
    pullPolicy: IfNotPresent

  command: []
  args: []
  
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    annotations: {}

  env:
    APP_NAME: "CO2 Calculator API"
    APP_VERSION: "0.1.0"
    DEBUG: "false"
    # Governs the cookie `Secure` attribute AND the OAuth redirect_uri scheme.
    # Keep "true" wherever a TLS terminator fronts the pods (all clusters);
    # only local plain-http dev sets it "false". See infra OAuth post-mortem.
    COOKIE_SECURE: "true"
    API_VERSION: "/api/v1"
    API_DOCS_PREFIX: "/api"
    LOG_LEVEL: "INFO"
    ALGORITHM: "HS256"
    ACCESS_TOKEN_EXPIRE_MINUTES: "480"
    REFRESH_TOKEN_EXPIRE_HOURS: "24"
    ROLE_PROVIDER_TYPE: "jwt" # Could be 'jwt', 'accred', or 'test'
    UNIT_PROVIDER_TYPE: "database" # Could be 'database', 'accred', or 'test'
    OAUTH_SCOPE: "openid profile email"
    OAUTH_COOKIE_PATH: "/"
    FRONTEND_URL: "http://localhost:3000" # Change to frontend URL in production
    ACCRED_AUTHORIZATION_HEALTHCHECK_URL: "https://url-you-want-to-check"
    MIN_CONFIGURABLE_YEAR: "2025" # Earliest year an admin can create a YearConfiguration for
    # Background job safety poller (orphan-job recovery)
    RUN_BACKGROUND_POLLER: "true"
    POLLER_INTERVAL_SECONDS: "2" # Seconds between poller sweeps
    POLLER_BATCH_LIMIT: "100" # Max NOT_STARTED jobs dispatched per sweep
    STALE_JOB_TIMEOUT_MINUTES: "5" # RUNNING jobs whose heartbeat is older than this are auto-recovered
    INGEST_COPY_BATCH_SIZE: "50000" # Rows per COPY batch for bulk CSV data_entries ingest
    ELASTICSEARCH_TIMEOUT: "30" # Key in the existing secret for Elasticsearch timeout
    ELASTICSEARCH_MAX_RETRIES: "3" # Key in the existing secret for Elasticsearch max retries
    ELASTICSEARCH_RETRY_ON_TIMEOUT: "true" # Key in the existing secret for Elasticsearch retry on timeout
    # SQLAlchemy/psycopg auto-instrumentation creates one span per SQL
    # statement, which measured as ~2/3 of the total OTel tax on this app
    # (plan #2050 C1 follow-up: -33% throughput with it on, -16% with it
    # off — sampling ratio barely moves it either way once this is off).
    # HTTP-level spans (FastAPI/Starlette) stay on. Unset this (empty
    # string) in an environment-specific override if SQL-level traces are
    # needed for active debugging — the cost is worth it there, not always-on.
    OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: "sqlalchemy,psycopg"

  secrets:
    # WARNING: These default values are INSECURE and MUST be overridden before production deployment!
    # Generate a secure key using: openssl rand -hex 32
    # Use backend.existingSecret.enabled=true for production environments
    SECRET_KEY: "" # REQUIRED: Must be set via --set flag or existing secret

    # OAuth/OIDC Configuration (optional, for future OAuth implementation)
    # OAUTH_CLIENT_ID: ""  # OAuth2 client ID from your identity provider
    # OAUTH_CLIENT_SECRET: ""  # OAuth2 client secret (keep secure!)
    # OAUTH_ISSUER_URL: ""  # OIDC issuer URL (e.g., https://keycloak.example.com/realms/your-realm)
    OAUTH_CLIENT_ID: ""
    OAUTH_CLIENT_SECRET: ""
    OAUTH_ISSUER_URL: ""
    OAUTH_TENANT_ID: ""

  podAnnotations: {}

  podSecurityContext:
    # runAsNonRoot: true
    # runAsUser: 1000
    # fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    limits:
      memory: 512Mi
    requests:
      # #2050 A3: 100m gave this pod roughly a tenth of a busy node's CPU
      # share under contention (no limit means no throttling, but CFS
      # shares are proportional to the request) — stacked on top of a
      # slower node this was a meaningful chunk of the dev/dev2 gap.
      cpu: 1
      memory: 128Mi

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /ready
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 0
    periodSeconds: 2
    failureThreshold: 30

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}
  existingSecret:
    # Default: reference a pre-existing Secret (production path).
    # For local/dev chart-managed secrets, set enabled=false and provide
    # backend.secrets.SECRET_KEY.
    enabled: true
    name: "" # REQUIRED when enabled=true: name of the pre-existing Secret
    keys:
      secretKeyKey: SECRET_KEY # Key in the existing secret for SECRET_KEY
      oauthClientIdKey: OAUTH_CLIENT_ID # Key in the existing secret for OAuth client ID
      oauthClientSecretKey: OAUTH_CLIENT_SECRET # Key in the existing secret for OAuth client secret
      oauthIssuerUrlKey: OAUTH_ISSUER_URL # Key in the existing secret for OAuth issuer URL
      oauthTenantIdKey: OAUTH_TENANT_ID # Key in the existing secret for OAuth tenant ID
      accredApiKeyKey: ACCRED_API_KEY # Key in the existing secret for Accred API key
      accredApiUsernameKey: ACCRED_API_USERNAME # Key in the existing secret for Accred API username
      accredApiBaseUrlKey: ACCRED_API_BASE_URL # Key in the existing secret for Accred API base URL
      filesEncryptionKeyKey: FILES_ENCRYPTION_KEY # Key in the existing secret for files encryption key
      filesEncryptionSaltKey: FILES_ENCRYPTION_SALT # Key in the existing secret for files encryption salt
      credentialsEncryptionKeyKey: CREDENTIALS_ENCRYPTION_KEY # Key in the existing secret for credential encryption key
      credentialsEncryptionSaltKey: CREDENTIALS_ENCRYPTION_SALT # Key in the existing secret for credential encryption salt
      filesMaxSizeMbKey: FILES_MAX_SIZE_MB # Key in the existing secret for maximum file size (MB)
      s3EndpointProtocolKey: S3_ENDPOINT_PROTOCOL # Key in the existing secret for S3 endpoint protocol
      s3EndpointHostnameKey: S3_ENDPOINT_HOSTNAME # Key in the existing secret for S3 endpoint hostname
      s3AccessKeyIdKey: S3_ACCESS_KEY_ID # Key in the existing secret for S3 access key ID
      s3SecretAccessKeyKey: S3_SECRET_ACCESS_KEY # Key in the existing secret for S3 secret access key
      s3RegionKey: S3_REGION # Key in the existing secret for S3 region
      s3BucketKey: S3_BUCKET # Key in the existing secret for S3 bucket
      s3PathPrefixKey: S3_PATH_PREFIX # Key in the existing secret for S3 path prefix
      elasticsearchHostsKey: ELASTICSEARCH_HOSTS # Key in the existing secret for Elasticsearch hosts
      elasticsearchIndexKey: ELASTICSEARCH_INDEX # Key in the existing secret for Elasticsearch index
      elasticsearchIdKey: ELASTICSEARCH_ID # Key in the existing secret for Elasticsearch document ID
      elasticsearchApiKeyKey: ELASTICSEARCH_API_KEY # Key in the existing secret for Elasticsearch API key
      elasticsearchCaCertFileKey: ELASTICSEARCH_CA_CERT_FILE # Key in the existing secret for Elasticsearch CA certificate
  elasticsearch:
    caCert:
      filename: http_ca_test.crt
      path: /tmp/
  tableau:
    verifySsl: "true"
    requestTimeoutSeconds: "300"
    restMinApiVersion: "2.4"
    maxFields: "50"
  connector:
    allowedHostSuffixes: "" # SSRF guard; empty fails closed, e.g. "epfl.ch"

  initContainers:
    waitForPostgres:
      resources: # Resources for the wait-for-postgres init container
        limits:
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi

  migrations:
    enabled: true # Run database migrations via init container

    resources: # Resources for the migration job container
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi

    waitForPostgres:
      resources: # Resources for the wait-for-postgres init container
        limits:
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi

# #2050 Track B — poller-only worker deployment. Disabled by default (the
# app runs as a single backend deployment, as it always has); set
# enabled=true to split job execution off the API pods. Reuses
# backend.image / backend.securityContext / backend.existingSecret — this
# is the same app process, not a separate build. See
# templates/backend-worker-deployment.yaml and
# templates/_helpers.tpl#backendSecretEnv.
worker:
  enabled: false
  replicaCount: 1

  env: {}
  # RUN_BACKGROUND_POLLER and DISPATCH_JOBS_INLINE are set unconditionally
  # by the template, not here — see backend-worker-deployment.yaml.

  podAnnotations: {}

  resources:
    limits:
      memory: 1Gi
    requests:
      # Generous on purpose: this pod runs the CPU-heavy recalc/ingestion
      # work the API deployment no longer has to. No neighbours to be
      # fair to on a dedicated job pod.
      cpu: 2
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8000
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 5

  # #2049: no Service, so this never gates traffic — but it does gate
  # RollingUpdate progress. Without it a new worker counts as "ready" the
  # instant the container starts, so maxSurge:1/maxUnavailable:0 would
  # swap in a worker that can't reach the DB. /ready reads the same
  # background-poller cache as the API deployment. No startupProbe: the
  # wait-for-postgres init container below already blocks the main
  # container from starting until Postgres is reachable.
  readinessProbe:
    httpGet:
      path: /ready
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/epfl-enac/epfl/co2-calculator/frontend
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
    annotations: {}

  # Forwarded as container env vars; the frontend's docker/entrypoint.sh
  # picks up APP_*-prefixed entries at startup and writes them to
  # /usr/share/nginx/html/injectEnv.js, where the bundle reads them as
  # window.injectedEnvVariable.
  #
  # Per-env values (real Sentry DSN, environment label) are overridden in
  # the ops repo (enack8s-app-config / openshift-app-config). Defaults here
  # are safe placeholders.
  env:
    API_BASE_URL: "/api"
    # Sentry/GlitchTip DSN. Empty string → src/boot/sentry.ts skips init,
    # so unconfigured deploys don't error.
    APP_SENTRY_DSN: ""
    # Environment label attached to every Sentry event. Override per-cluster
    # in the ops repo (e.g. "stage", "production").
    APP_ENVIRONMENT: "production"
    # Public label + portal URL shown in the calculator's access popover (role
    # delegation). Free text — NOT the backend ROLE_PROVIDER_TYPE/
    # UNIT_PROVIDER_TYPE provider selection.
    # Example placeholders only; real per-env values are set in the ops repo.
    # No code default: if unset the popover CTA/label is hidden.
    APP_ACCESS_MANAGEMENT_PROVIDER_NAME: "ACCRED"
    APP_ACCESS_MANAGEMENT_PROVIDER_URL: "https://access-management.example.com"
    APP_ACCESS_MANAGEMENT_PROVIDER_ABOUT_URL: "https://access-management.example.com/about"
    APP_ROLES_DOC_URL: "https://docs.example.com/roles/"
    APP_EQUIPMENT_POWER_FEEDBACK_EMAIL: "test@epfl.ch"

  podAnnotations: {}

  podSecurityContext:
    # runAsNonRoot: true
    # runAsUser: 101
    # fsGroup: 101

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080 # Match the targetPort
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: /ready
      port: 8080 # Match the targetPort
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 0
    periodSeconds: 2
    failureThreshold: 30

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Database configuration
# External PostgreSQL database (managed separately, e.g., via Bitnami chart)
# -----------------------------------------------------------------------------
database:
  # Secret containing database connection details
  # This secret must contain the following keys:
  #   - DB_URL: Full PostgreSQL connection string (used by backend)
  #     Format: postgresql://user:password@host:port/database
  #   - DB_PASSWORD: Database password (used by Bitnami PostgreSQL chart)
  #
  # These keys map to the Bitnami PostgreSQL chart's existingSecret configuration:
  #   global.postgresql.auth.existingSecret: <name>
  #   global.postgresql.auth.secretKeys.adminPasswordKey: DB_PASSWORD
  #   global.postgresql.auth.secretKeys.userPasswordKey: DB_PASSWORD
  existingSecret:
    name: "db-secret"
    keys:
      # use for backend and migrations job
      url: DB_URL
      # use for bitnami/postgresql chart
      password: DB_PASSWORD

  # Wait for PostgreSQL readiness before starting backend/migrations
  waitForPostgres:
    enabled: true
    image:
      repository: bitnamilegacy/postgresql
      tag: "latest"
      pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    # Simple mode - just specify hostname(s), paths are auto-configured
    - co2-calculator.local
    # Or use multiple hosts:
    # - co2-calculator.local
    # - co2-calculator.example.com

    # Advanced mode - full control over paths (optional)
    # - host: co2-calculator.local
    #   paths:
    #     - path: /api
    #       pathType: Prefix
    #       backend: backend
    #     - path: /
    #       pathType: Prefix
    #       backend: frontend
  tls: []

# OpenShift Routes configuration
routes:
  enabled: false
  host: "co2-calculator.local"
  frontend:
    extraLabels: {}
    annotations: {}
    weight: 100
    tls:
      termination: edge

  backend:
    extraLabels: {}
    annotations: {}
    weight: 100
    tls:
      termination: edge

  docs:
    enabled: true
    extraLabels:
      route: private
    annotations: {}
    weight: 100
    tls:
      termination: edge

serviceAccount:
  create: true
  annotations: {}
  name: ""

  # imagePullSecrets:
  #   - name: docker-reg-cred
  imagePullSecrets: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

networkPolicies:
  enabled: false
  ingressFromRoutes: [] # Define allowed ingress sources (e.g., namespaces, pods) for network policies
    # Example
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: openshift-ingress
    #   podSelector:
    #     matchLabels:
    #       ingresscontroller.operator.openshift.io/deployment-ingresscontroller: ingress-private

# -----------------------------------------------------------------------------
# Documentation deployment
# Static documentation served via nginx, built from docs/ directory
# Built automatically by CI/CD via deploy.yml and deploy-quay.yml
# Image tag is set by ArgoCD based on branch:
#   - dev branch → commit SHA
#   - stage branch → commit SHA
#   - tags (v*) → version tag (e.g., v1.2.3)
# -----------------------------------------------------------------------------
docs:
  enabled: true
  replicaCount: 1

  image:
    repository: ghcr.io/epfl-enac/epfl/co2-calculator/docs
    tag: "latest" # Overridden by ArgoCD with actual tag from CI/CD
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
    annotations: {}

  podAnnotations: {}

  podSecurityContext:
    # runAsNonRoot: true
    # runAsUser: 101
    # fsGroup: 101

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}
