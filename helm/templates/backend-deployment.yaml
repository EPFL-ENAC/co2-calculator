{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "co2-calculator.fullname" . }}-backend
  labels:
    {{- include "co2-calculator.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  revisionHistoryLimit: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # #2050 A2: maxSurge:0/maxUnavailable:1 made every rollout a
      # guaranteed outage window on a single-replica deployment (dev) and
      # a capacity dip on multi-replica ones (stage). A new pod comes up
      # before an old one leaves instead.
      maxSurge: 1
      maxUnavailable: 0

  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "co2-calculator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      annotations:
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "co2-calculator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "co2-calculator.serviceAccountName" . }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        {{- if .Values.database.waitForPostgres.enabled }}
        - name: wait-for-postgres
          image: {{ .Values.database.waitForPostgres.image.repository }}:{{ .Values.database.waitForPostgres.image.tag }}
          imagePullPolicy: {{ .Values.database.waitForPostgres.image.pullPolicy }}
          command: ['sh', '-c']
          args:
            - |
              until pg_isready -d ${DB_URL}; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              echo "PostgreSQL is ready!"
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "co2-calculator.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecret.keys.url }}
          resources:
            {{- toYaml .Values.backend.initContainers.waitForPostgres.resources | nindent 12 }}
        {{- end }}
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.command }}
          command: {{ . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.args }}
          args: {{ . | toYaml | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          env:
            {{- include "co2-calculator.backendSecretEnv" . | nindent 12 }}
            {{- /* When the worker split is on, the explicit block below owns
                 these two keys. Emitting them from backend.env as well made a
                 duplicate env name — Kubernetes tolerates that (last entry
                 wins) but strategic-merge-patch does not: ArgoCD's diff dies
                 with "order in patch list doesn't match $setElementOrder"
                 and the app wedges in ComparisonError. */}}
            {{- $env := .Values.backend.env }}
            {{- if .Values.worker.enabled }}
            {{- $env = omit $env "RUN_BACKGROUND_POLLER" "DISPATCH_JOBS_INLINE" }}
            {{- end }}
            {{- range $key, $value := $env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.worker.enabled }}
            # #2050 Track B: worker.enabled is the single switch — API pods
            # stop executing jobs themselves the moment a worker exists to
            # pick them up. These take the place of backend.env's static
            # values (omitted from the range above), so the pairing can't
            # drift out of sync between the two Deployments.
            - name: RUN_BACKGROUND_POLLER
              value: "false"
            - name: DISPATCH_JOBS_INLINE
              value: "false"
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "co2-calculator.backendSecretVolumeMount" . | nindent 12 }}

      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "co2-calculator.backendSecretVolume" . | nindent 8 }}

      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
