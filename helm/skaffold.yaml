# Local Kubernetes loop: `make skaffold-dev` builds the two images, deploys
# a throwaway PostgreSQL, Traefik and the chart, and rebuilds on change.
# Open http://localhost:8090/en/login-test. Needs a local cluster context
# (Docker Desktop, kind or minikube) and the images it can see.
apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: co2-calculator
build:
  local:
    push: false
  artifacts:
    - image: co2-calculator-backend
      context: ../backend
    - image: co2-calculator-frontend
      context: ../frontend
deploy:
  # Never the current context: a maintainer's kubeconfig holds the shared
  # clusters. --kube-context overrides it, e.g. for kind.
  kubeContext: docker-desktop
  helm:
    # Released in this order: the app's migration Job waits for PostgreSQL.
    releases:
      - name: co2-local
        chartPath: skaffold
        namespace: co2-calculator
        createNamespace: true
      - name: traefik
        remoteChart: oci://ghcr.io/traefik/helm/traefik
        version: "42.2.0"
        namespace: co2-calculator
        setValues:
          service.type: ClusterIP
          ingressClass.isDefaultClass: false
          providers.kubernetesIngress.namespaces[0]: co2-calculator
          providers.kubernetesCRD.enabled: false
      - name: co2-calculator
        chartPath: .
        namespace: co2-calculator
        valuesFiles:
          - skaffold/values-app.yaml
        setValueTemplates:
          backend.image.repository: "{{.IMAGE_REPO_co2_calculator_backend}}"
          backend.image.tag: "{{.IMAGE_TAG_co2_calculator_backend}}"
          frontend.image.repository: "{{.IMAGE_REPO_co2_calculator_frontend}}"
          frontend.image.tag: "{{.IMAGE_TAG_co2_calculator_frontend}}"
portForward:
  - resourceType: service
    resourceName: traefik
    namespace: co2-calculator
    port: 80
    # 8080 is the Traefik dashboard of docker-compose.yml.
    localPort: 8090
    # The login sends the browser back to FRONTEND_URL, http://localhost:8090.
    address: localhost
