# The two Secrets that the chart reads and does not create.
# Do not commit this file after you fill it. Replace each <change-me>.
#
# The pods reference every key below, so every key must exist. A key of a
# feature that you do not use keeps the value shown here.
apiVersion: v1
kind: Secret
metadata:
  name: co2-db
type: Opaque
stringData:
  # The scheme must be postgresql://. The wait-for-postgres container
  # gives this URL to pg_isready, which does not read
  # postgresql+psycopg:// and then waits on the wrong host.
  DB_URL: "postgresql://<user>:<change-me>@<host>:5432/<database>"
---
apiVersion: v1
kind: Secret
metadata:
  name: co2-backend
type: Opaque
stringData:
  # Signing keys, 32 characters or more. The backend refuses a shorter
  # key. Make two different values: openssl rand -hex 32
  JWT_HMAC_KEY: "<change-me>"
  SESSION_HMAC_KEY: "<change-me>"

  # Login provider (OIDC), for example Keycloak.
  OAUTH_CLIENT_ID: "<change-me>"
  OAUTH_CLIENT_SECRET: "<change-me>"
  OAUTH_ISSUER_URL: "https://login.example.org/realms/<realm>"
  OAUTH_TENANT_ID: "<change-me>"

  # Encryption of the connector credentials in the database. Required:
  # the backend does not start without the two values.
  # Key: openssl rand -hex 32. Salt: openssl rand -hex 16.
  # Keep the two values for the life of the data.
  CREDENTIALS_ENCRYPTION_KEY: "<change-me>"
  CREDENTIALS_ENCRYPTION_SALT: "<change-me>"

  # S3-compatible storage for the uploaded files. The pods have no
  # persistent volume.
  S3_ENDPOINT_PROTOCOL: "https"
  S3_ENDPOINT_HOSTNAME: "s3.example.org"
  S3_ACCESS_KEY_ID: "<change-me>"
  S3_SECRET_ACCESS_KEY: "<change-me>"
  S3_REGION: "<change-me>"
  S3_BUCKET: "<change-me>"
  S3_PATH_PREFIX: ""
  FILES_MAX_SIZE_MB: "100"
  # Encryption of the uploaded files. Required: the backend does not
  # start without the two values. Key: openssl rand -hex 32. Salt:
  # openssl rand -hex 16. Keep the two values for the life of the data.
  FILES_ENCRYPTION_KEY: "<change-me>"
  FILES_ENCRYPTION_SALT: "<change-me>"

  # Accred, a directory of roles and units. Keep the values empty if
  # your institution does not have it.
  ACCRED_API_BASE_URL: ""
  ACCRED_API_USERNAME: ""
  ACCRED_API_KEY: ""

  # Export of the audit log to Elasticsearch.
  ELASTICSEARCH_HOSTS: "https://localhost:9200"
  ELASTICSEARCH_INDEX: "UNDEFINED_INDEX"
  ELASTICSEARCH_ID: ""
  ELASTICSEARCH_API_KEY: ""
  # CA certificate of Elasticsearch in PEM format. The chart mounts it as
  # a file.
  ELASTICSEARCH_CA_CERT_FILE: ""
