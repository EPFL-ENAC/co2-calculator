name: Append issue number to title

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  suffix-title:
    runs-on: ubuntu-latest
    steps:
      - name: Append (#<number>) if missing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$TITLE" =~ \(#${NUMBER}\)$ ]]; then
            exit 0
          fi
          gh issue edit "$NUMBER" --repo "$REPO" --title "$TITLE (#$NUMBER)"
