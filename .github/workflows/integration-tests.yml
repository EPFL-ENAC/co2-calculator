name: Integration Tests (daily)

on:
  schedule:
    # Every day at 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: ['ci-test/**']

jobs:
  test-backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Run backend integration tests (with coverage)
        run: make test-cov-xml-integration

      - name: Upload coverage reports
        if: always()
        timeout-minutes: 5
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: EPFL-ENAC/co2-calculator
          flags: backend-integration
          files: ./backend/coverage.xml
          disable_search: true
          fail_ci_if_error: false

  test-frontend-integration:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest
    # Official Playwright image ships both OS-level dependencies and browser binaries.
    # Keep the image tag in sync with @playwright/experimental-ct-vue in frontend/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
      # Run as uid 1001 to match the owner of /github/home set by the GitHub Actions
      # runner. Browsers (Firefox in particular) refuse to launch when $HOME is owned
      # by a different user than the process running them.
      options: --user 1001
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.nvmrc'
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Build Folders
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ./frontend/dist
            ./frontend/node_modules/.cache
          # The key changes if any source file or dependency changes
          key: ${{ runner.os }}-build-${{ hashFiles('frontend/src/**', 'frontend/package-lock.json', 'frontend/quasar.config.js') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Quasar prepare
        run: npx quasar prepare

      - name: Build frontend
        # Vite is smart: if node_modules/.cache exists, this will be significantly faster
        run: npm run build

      - name: Run frontend tests e2e
        run: npm run test:e2e
