# https://github.com/EPFL-ENAC/epfl-enac-build-push-deploy-action#readme
name: deploy

"on":
  push:
    branches:
      - dev
      - stage
      - "ci-test/**"
    tags: ["v*.*.*"]

jobs:
  publish-chart:
    uses: ./.github/workflows/publish_chart.yaml
    with:
      name: "co2-calculator"
      registry: "epfl-enac/co2-calculator"
  deploy:
    needs:
      - publish-chart
    permissions:
      contents: read
      packages: write
    uses: EPFL-ENAC/epfl-enac-build-push-deploy-action/.github/workflows/deploy.yml@v3.0.7
    secrets:
      token: ${{ secrets.CD_TOKEN }}
      registry_token: ${{ secrets.QUAY_TOKEN }}
    with:
      ORG: epfl
      REPO: co2-calculator
      build_context: '[ "./frontend", "./backend", "./docs" ]'
      helm_chart_name: co2-calculator
      helm_chart_version: ${{ needs.publish-chart.outputs.chart_version }}
      # Baked into the frontend bundle as APP_VERSION (see frontend/quasar.config.js)
      # so Sentry/GlitchTip events are tagged with the exact deploy SHA. Backend
      # and docs Dockerfiles ignore this arg (Docker just warns).
      build_args: |
        GIT_SHA=${{ github.sha }}
      registries: |
        [
          {
            "registry": "ghcr.io",
            "argo_repositories": ["EPFL-ENAC/enack8s-app-config"]
          },
          {
            "registry": "quay-its.epfl.ch",
            "registry_path": "svc1751",
            "registry_username": "svc1751+ghaction",
            "argo_repositories": ["EPFL-ENAC/openshift-app-config"]
          }
        ]

  # Immediate feedback on the images just built. Fails only on findings with
  # an available fix (--ignore-unfixed): unfixable base-image CVEs are drift,
  # tracked by the weekly registry scan instead. Runs after deploy, so it
  # alerts without gating the rollout.
  scan-built-images:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read
    strategy:
      matrix:
        image: [frontend, backend]
    steps:
      # Version-pinned with a hardcoded checksum: installing from a live apt
      # repo would run whatever it serves that day as root on the runner.
      - name: Install trivy (pinned)
        run: |
          TRIVY_VERSION=0.72.0
          TRIVY_SHA256=9bf8aba92f524b74f8e83d53b298a7dfc6b4d60aca779217e7817e5433c73eeb
          wget -q "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          echo "${TRIVY_SHA256}  trivy_${TRIVY_VERSION}_Linux-64bit.deb" | sha256sum -c
          sudo dpkg -i "trivy_${TRIVY_VERSION}_Linux-64bit.deb"

      - name: Scan freshly built image (fail on fixable HIGH/CRITICAL)
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            ghcr.io/epfl-enac/epfl/co2-calculator/${{ matrix.image }}:${{ github.sha }}
