# https://github.com/EPFL-ENAC/epfl-enac-build-push-deploy-action#readme
name: deploy

"on":
  push:
    branches:
      - dev
      - stage
      - "ci-test/**"
    tags: ["v*.*.*"]

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: EPFL-ENAC/epfl-enac-build-push-deploy-action/.github/workflows/deploy.yml@v3.5.0
    secrets:
      token: ${{ secrets.CD_TOKEN }}
      registry_token: ${{ secrets.QUAY_TOKEN }}
    with:
      ORG: epfl
      REPO: co2-calculator
      build_context: '[ "./frontend", "./backend", "./docs" ]'
      helm_chart_name: co2-calculator
      # The action packages and pushes the chart in a job that runs beside
      # the image builds; only its update-manifest waits for it.
      helm_chart_path: ./helm
      # Smoke-test both secret paths. Default (external) needs a Secret name;
      # chart-managed (dev) needs throwaway signing keys. Real deploys inject
      # the real values.
      helm_chart_render_args: |
        --set backend.existingSecret.name=ci-existing-secret
        --set backend.existingSecret.enabled=false --set backend.secrets.JWT_HMAC_KEY=ci-render-check --set backend.secrets.SESSION_HMAC_KEY=ci-render-check
      # Scan images in the build job, before push: fixable or not, HIGH/
      # CRITICAL findings block the rollout instead of alerting after it.
      skip_vulnerability_scan: false
      # GIT_SHA is baked into the frontend bundle as its APP_VERSION (see
      # frontend/quasar.config.js) so GlitchTip events carry the exact deploy
      # SHA, and into the backend image as GIT_SHA (#2436). The docs image
      # ignores both; Docker just warns.
      build_args: |
        GIT_SHA=${{ github.sha }}
      # APP_VERSION: the version the images report at runtime, from the same
      # root package.json the release tag comes from (#2437). It used to be
      # typed by hand into each gitops overlay, where nothing checked it.
      # Only a tag build gets the bare version; dev adds the commit's UTC
      # timestamp so every dev image between two bumps reports a different
      # string, and any other branch is marked so a ci-test image can never
      # look like a release. The commit date, not the clock: this runs once
      # per image in parallel and the three images must agree.
      build_args_script: |
        VERSION=$(node -p "require('./package.json').version || ''")
        [ -n "$VERSION" ] || { echo "root package.json has no version" >&2; exit 1; }
        STAMP=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%d-%H%M HEAD)
        case "$GITHUB_REF_TYPE:$GITHUB_REF_NAME" in
          tag:*)        ;;
          branch:dev)   VERSION="$VERSION-dev-$STAMP" ;;
          branch:stage) VERSION="$VERSION-rc" ;;
          *)            VERSION="$VERSION-$(echo "$GITHUB_REF_NAME" | tr '/' '-')" ;;
        esac
        echo "APP_VERSION=$VERSION"
      registries: |
        [
          {
            "registry": "ghcr.io",
            "argo_repositories": ["EPFL-ENAC/enack8s-app-config"]
          },
          {
            "registry": "quay-its.epfl.ch",
            "registry_path": "svc1751",
            "registry_username": "svc1751+ghaction",
            "argo_repositories": ["EPFL-ENAC/openshift-app-config"]
          }
        ]
