# https://github.com/EPFL-ENAC/epfl-enac-build-push-deploy-action#readme
name: deploy

"on":
  push:
    branches:
      - dev
      - stage
      - "ci-test/**"
    tags: ["v*.*.*"]

jobs:
  # The version the images report at runtime, taken from the same root
  # package.json the release tag comes from (#2437). It used to be typed by
  # hand into each gitops overlay, where nothing checked it: stage claimed
  # "sprint-6-stage-2026-03-04" for six months, and its backend and worker
  # blocks disagreed while running the same image.
  app-version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        # Fail here rather than ship Settings.APP_VERSION's "0.1.0" default:
        # this string surfaces in the pod heartbeat, the workers view and the
        # OpenAPI document, where a wrong value reads as authoritative.
        run: |
          VERSION=$(node -p "require('./package.json').version || ''")
          [ -n "$VERSION" ] || { echo "root package.json has no version"; exit 1; }
          # Same suffixes the chart versions already use (1.0.1487-dev,
          # 1.0.1485-rc), so the three environments stay tellable apart at a
          # glance. Only a tag build - the one the release workflow cuts -
          # gets the bare version; anything else is marked, so a ci-test image
          # can never look like a release.
          #
          # dev also carries a UTC build timestamp. The version itself only
          # moves at the runbook's bump commit, so without it every dev image
          # between two releases reports the same string. Unlike the
          # hand-written "dev-2026-07-10" this replaces, it is generated by
          # the build that stamps it and cannot go stale. GIT_SHA stays the
          # exact identity; this is the human-readable "how old is this pod".
          case "$GITHUB_REF_TYPE:$GITHUB_REF_NAME" in
            tag:*)        ;;
            branch:dev)   VERSION="$VERSION-dev-$(date -u +%Y-%m-%d-%H%M)" ;;
            branch:stage) VERSION="$VERSION-rc" ;;
            *)            VERSION="$VERSION-$(echo "$GITHUB_REF_NAME" | tr '/' '-')" ;;
          esac
          echo "value=$VERSION" >> $GITHUB_OUTPUT
  publish-chart:
    uses: ./.github/workflows/publish_chart.yaml
    with:
      name: "co2-calculator"
      registry: "epfl-enac/co2-calculator"
  deploy:
    needs:
      - publish-chart
      - app-version
    permissions:
      contents: read
      packages: write
    uses: EPFL-ENAC/epfl-enac-build-push-deploy-action/.github/workflows/deploy.yml@v3.1.0
    secrets:
      token: ${{ secrets.CD_TOKEN }}
      registry_token: ${{ secrets.QUAY_TOKEN }}
    with:
      ORG: epfl
      REPO: co2-calculator
      build_context: '[ "./frontend", "./backend", "./docs" ]'
      helm_chart_name: co2-calculator
      helm_chart_version: ${{ needs.publish-chart.outputs.chart_version }}
      # Scan images in the build job, before push: fixable or not, HIGH/
      # CRITICAL findings block the rollout instead of alerting after it.
      skip_vulnerability_scan: false
      # GIT_SHA is baked into the frontend bundle as its APP_VERSION (see
      # frontend/quasar.config.js) so GlitchTip events carry the exact deploy
      # SHA, and into the backend image as GIT_SHA (#2436). The docs image
      # ignores both; Docker just warns.
      build_args: |
        GIT_SHA=${{ github.sha }}
        APP_VERSION=${{ needs.app-version.outputs.value }}
      registries: |
        [
          {
            "registry": "ghcr.io",
            "argo_repositories": ["EPFL-ENAC/enack8s-app-config"]
          },
          {
            "registry": "quay-its.epfl.ch",
            "registry_path": "svc1751",
            "registry_username": "svc1751+ghaction",
            "argo_repositories": ["EPFL-ENAC/openshift-app-config"]
          }
        ]
