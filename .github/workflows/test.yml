name: Tests

on:
  pull_request:
    branches: [main, dev, stage]
  # Deliberately NOT main/dev/stage (#2432): those are PR heads on the two
  # promotion PRs (dev -> stage, stage -> main), so listing them here ran the
  # whole suite twice on the same commit. `pull_request` already tests the
  # merge result.
  push:
    branches: ["ci-test/**"]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Run backend tests (with coverage)
        run: make test-cov-xml

      - name: Upload coverage reports
        if: always()
        timeout-minutes: 5
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: EPFL-ENAC/co2-calculator
          flags: backend
          files: ./backend/coverage.xml
          disable_search: true
          fail_ci_if_error: false

  test-backend-migrations:
    name: Backend Migration Smoke (db-create + db-migrate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      # Spawns its own postgres:16-alpine container (matches existing
      # tests/integration/services/data_ingestion/conftest.py pattern) and
      # exercises the exact commands `make db-create && make db-migrate`
      # runs.  Scoped to a single file so it stays fast on PRs; the daily
      # integration suite picks it up too via the normal tests/integration/
      # discovery.
      - name: Run alembic migration smoke test
        run: uv run pytest tests/integration/test_alembic_migrations.py -vv

      # #2527 Phase A and B.  Phase A's pin that two units uploading the
      # same (module_type, det, year) both get a recalc child; Phase B's
      # pin which of those two uploads may run concurrently and which must
      # still serialize.  Both are real-PG-only (partial indexes, enum
      # types, advisory-lock modes), so they used to run nightly and never
      # on a PR — which meant the guard against silent wrong totals gated
      # nothing.  Same throwaway container as above, so this costs two
      # more files, not new infrastructure.
      - name: Run emission-recalc dedup and factor-lock scoping tests
        run: >
          uv run pytest
          tests/integration/services/data_ingestion/test_emission_recalc_dedup_pg.py
          tests/integration/services/data_ingestion/test_factor_lock_scoping_pg.py
          -vv

      # #2527: the kg_co2eq sort's buffer budget. Real-PG-only (EXPLAIN
      # BUFFERS, partial/covering indexes), and deterministic — page counts
      # are identical on a laptop and on a runner, so this cannot flake.
      - name: Run kg_co2eq sort buffer-budget test
        run: >
          uv run pytest
          tests/integration/services/data_ingestion/test_kg_sort_buffer_budget_pg.py
          -vv

      # #2527 C1: the data_entries.data constraints. Real-PG-only — the
      # unit suite covers the portable NULL half on SQLite, but the JSON
      # `null` and `{}` halves need json_typeof and a jsonb comparison.
      # Those two are the ones a Python guard cannot catch: SQLAlchemy
      # writes `data=None` as the JSON scalar `null`, which is not SQL NULL.
      - name: Run data_entries.data constraint tests
        run: >
          uv run pytest
          tests/integration/services/data_ingestion/test_data_entry_data_constraint_pg.py
          -vv

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    # Official Playwright image ships both OS-level dependencies and browser binaries.
    # Keep the image tag in sync with the @playwright/* versions in frontend/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy
      # Run as uid 1001 to match the owner of /github/home set by the GitHub Actions
      # runner. Browsers (Firefox in particular) refuse to launch when $HOME is owned
      # by a different user than the process running them.
      options: --user 1001
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Build Folders
        uses: actions/cache@v4
        with:
          path: |
            ./frontend/dist
            ./frontend/node_modules/.cache
          # The key changes if any source file or dependency changes
          key: ${{ runner.os }}-build-${{ hashFiles('frontend/src/**', 'frontend/package-lock.json', 'frontend/quasar.config.js') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Quasar prepare
        run: npx quasar prepare

      - name: Build frontend
        # Vite is smart: if node_modules/.cache exists, this will be significantly faster
        run: npm run build

      - name: Run frontend tests components
        run: npm run test-ct

      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v5
        with:
          flags: frontend
          directory: ./frontend
          fail_ci_if_error: false
