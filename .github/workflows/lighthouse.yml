name: Lighthouse CI (daily)


on:
  schedule:
    # Every day at 04:00 UTC (offset from integration-tests' 03:30 to avoid pileup)
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: ['ci-test/**']

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          cache: "npm"
          node-version-file: '.nvmrc'
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Restore frontend build cache
        id: build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./frontend/dist
          key: frontend-build-${{ hashFiles('frontend/src/**', 'frontend/package-lock.json') }}

      - name: Install frontend dependencies
        if: steps.build-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: install ligthouse
        working-directory: ./frontend
        run: npm install lighthouse --no-save

      - name: Install ecoindex plugin
        run: npm install lighthouse-plugin-ecoindex-core --no-save

      - name: Build frontend
        if: steps.build-cache.outputs.cache-hit != 'true'
        working-directory: ./frontend
        run: npm run build

      - name: Inject Lighthouse bypass flag into index.html
        run: |
          node -e "
            const fs = require('fs');
            const path = './frontend/dist/spa/index.html';
            const html = fs.readFileSync(path, 'utf8');
            fs.writeFileSync(path, html.replace('</head>', '<script>window.__LIGHTHOUSE_BYPASS__=true;</script></head>'));
          "

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@72f881228236981b625ed765b928efb1786a1f55 # v11
        with:
          configPath: "./frontend/.lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true
