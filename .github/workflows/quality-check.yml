name: Quality Checks

on:
  pull_request:
    branches: [main, dev, stage]
  # Deliberately NOT main/dev/stage (#2432): those are PR heads on the two
  # promotion PRs (dev -> stage, stage -> main), so listing them here ran every
  # check twice on the same commit. `pull_request` already tests the merge
  # result, and lefthook's pre-push hook runs `make ci` for direct pushes to
  # those three branches.
  push:
    branches: ["ci-test/**"]

jobs:
  # #3244: another institution runs the same images, so no EPFL, Accred or
  # Entra value may be written in the code. Exceptions and their reasons are
  # in scripts/institution-words-allowlist.txt.
  institution-words:
    name: No institution words in the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for EPFL, Accred and Entra
        run: make check-institution-words

  frontent-quality:
    name: Frontent Lint/Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check code formatting
        run: make lint

      - name: Quasar prepare
        run: npx quasar prepare

      - name: Type Check
        run: make type-check

  # The chart checks ran only in the local `make lint`, so a PR could merge
  # a chart that no longer renders with the public example, or an example
  # Secret that lacks a key the pods read.
  helm-quality:
    name: Helm Lint
    runs-on: ubuntu-latest
    env:
      HELM_VERSION: "4.3.1"
      HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
      HELM_DOCS_VERSION: "1.14.2"
      HELM_DOCS_SHA256: a8cf72ada34fad93285ba2a452b38bdc5bd52cc9a571236244ec31022928d6cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned, not the runner's helm: a runner image without it would turn
      # the job green with nothing checked. The Makefile fails under CI too.
      - name: Install helm
        run: |
          archive="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          curl -sSfLO "https://get.helm.sh/${archive}"
          echo "${HELM_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" linux-amd64/helm
          sudo mv linux-amd64/helm /usr/local/bin/helm

      # The VALUES.md table layout can change between helm-docs versions:
      # keep this pin and the local one the same.
      - name: Install helm-docs
        run: |
          archive="helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfLO "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/${archive}"
          echo "${HELM_DOCS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" helm-docs
          sudo mv helm-docs /usr/local/bin/helm-docs

      - name: Lint the chart, the examples and VALUES.md
        run: make -C helm lint

  backend-quality:
    name: Backend Lint/Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Check code formatting
        run: make lint

      - name: Type Check
        run: make type-check

  gen-constants-check:
    name: Generated Frontend Constants Up To Date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install backend dependencies
        working-directory: ./backend
        run: uv sync

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      # gen-module-constants' recipe formats its output with prettier —
      # needs frontend's node_modules, not just Node itself.
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: Regenerate frontend constants from backend enums
        working-directory: ./backend
        # Importing the app constructs Settings; CI has no backend/.env, so
        # seed it from the example the way the Makefile's test targets do.
        run: |
          cp .env.example .env
          make gen-emission-taxonomy
          make gen-module-constants

      - name: Fail if generated constants are stale
        run: |
          git diff --exit-code \
            frontend/src/types/emission-taxonomy.gen.ts \
            frontend/src/types/module-lookups.gen.ts

  docs-quality:
    name: Docs Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # mkdocs-git-authors-plugin reads history; a shallow clone breaks it.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "./package-lock.json"

      # docs/Makefile's `lint` target shells out to `npx prettier`, which
      # resolves from the nearest node_modules up the tree — install root's
      # so it's the pinned root prettier@3.9.6, not whatever npx fetches.
      - name: Install Node dependencies
        working-directory: .
        run: npm ci --ignore-scripts

      - name: Check Markdown formatting
        run: make lint

      # --strict turns a broken link, unparseable frontmatter or an unknown
      # plan status into a failure here, rather than at deploy time on main.
      - name: Build docs
        run: uv run mkdocs build --strict --site-dir /tmp/docs-site
