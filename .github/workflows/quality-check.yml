name: Quality Checks

on:
  pull_request:
    branches: [main, dev, stage]
  push:
    branches: [main, dev, stage, 'ci-test/**']

jobs:

  frontent-quality:
    name: Frontent Lint/Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check code formatting
        run: make lint

      - name: Quasar prepare
        run: npx quasar prepare

      - name: Type Check
        run: make type-check


  backend-quality:
    name: Backend Lint/Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Check code formatting
        run: make lint

      - name: Type Check
        run: make type-check


  docs-quality:
    name: Docs Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs

    steps:
      - uses: actions/checkout@v7
        with:
          # mkdocs-git-authors-plugin reads history; a shallow clone breaks it.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Check Markdown formatting
        run: make lint

      # --strict turns a broken link, unparseable frontmatter or an unknown
      # plan status into a failure here, rather than at deploy time on main.
      - name: Build docs
        run: uv run mkdocs build --strict --site-dir /tmp/docs-site
