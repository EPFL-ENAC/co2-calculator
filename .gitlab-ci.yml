# Every deploy runs here, on gitlab.epfl.ch: dev, stage and release tags
# vX.Y.Z (prod). quay-its.epfl.ch only accepts traffic from the EPFL
# network, so GitHub-hosted runners cannot push there. GitHub keeps the
# code, the PRs and "Tag and Release", and mirror-to-gitlab.yml pushes
# dev, stage and the tags here. One pipeline per ref, so the Argo
# overlays never get two competing commits.
# https://gitlab.epfl.ch/EPFL-ENAC/build-push-deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "stage"
    # A SemVer tag deploys to prod and publishes chart X.Y.Z. Tags are
    # always vX.Y.Z here, never a pre-release.
    - if: $CI_COMMIT_TAG =~ /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/

include:
  - component: $CI_SERVER_FQDN/EPFL-ENAC/build-push-deploy/deploy@0.4.0
    inputs:
      org: epfl
      repo: co2-calculator
      build_contexts: [frontend, backend, docs]
      # Re-tag instead of rebuilding images whose context did not change,
      # Tag pipelines always rebuild. APP_VERSION is read from the root
      # package.json, outside every context: a version bump must
      # rebuild all three images. Reused images are not rescanned per
      # deploy: image-vulnerability-scan.yml scans the tags on a schedule.
      reuse_unchanged_images: true
      rescan_reused_images: false
      build_key_paths: package.json
      helm_chart_path: helm
      helm_chart_repository: ghcr.io/epfl-enac/co2-calculator/helm
      # Smoke-test the render. The chart only reads an existing Secret, so
      # it needs a Secret name. Real deploys name the real Secret.
      helm_chart_render_args: |
        --set backend.existingSecret.name=ci-existing-secret
      # GIT_SHA: the frontend's APP_VERSION for GlitchTip and the backend's
      # GIT_SHA (#2436). Every image also uses it to re-run its `apk upgrade`
      # layer on each build.
      build_args: |
        GIT_SHA=$CI_COMMIT_SHA
      # APP_VERSION (#2437): see the script
      build_args_script: sh scripts/app-version.sh
      registries: |
        [
          {"prefix": "ghcr.io/epfl-enac/epfl/co2-calculator",
           "username_var": "GHCR_USERNAME", "password_var": "GHCR_TOKEN",
           "argo_repositories": ["EPFL-ENAC/enack8s-app-config"]},
          {"prefix": "quay-its.epfl.ch/svc1751",
           "username_var": "QUAY_USERNAME", "password_var": "QUAY_PASSWORD",
           "argo_repositories": ["EPFL-ENAC/openshift-app-config"]}
        ]
