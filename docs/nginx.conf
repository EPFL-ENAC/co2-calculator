# Server of the docs image, in place of the base default.conf. It adds the
# client check of #3196: a client outside the allowed networks goes to /,
# where the frontend shows the info page. Same geo file as the frontend:
# the image one allows every client, the chart mounts the real list.
geo $client_outside {
  default 0;
  include /etc/nginx/client-allowlist/geo.conf;
}
# The kubelet calls the pod directly, so its probe has no X-Forwarded-For.
# The router and the load balancer always add the header: the probe path
# stays closed to every client that comes through them.
map $http_x_forwarded_for $direct_request {
  default 0;
  "" 1;
}
map $uri $docs_probe {
  default 0;
  /healthz $direct_request;
}
map "$client_outside$docs_probe" $send_home {
  default 0;
  10 1;
}

server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # The router strips /docs, so the browser must get "/", not a URL with
  # the pod host and port.
  absolute_redirect off;

  if ($send_home) {
    return 302 /;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }
}
