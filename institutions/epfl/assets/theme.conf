# EPFL theme (#3244).
#
# The names and their defaults are in
# frontend/institution-default/theme.conf.example.

accent: #ff0000
accent-hover: #b51f1f
accent-light: #fbeceb
accent-lighter: #f4c6c2

# Suisse Int'l from the ENAC font server. Its license does not allow the
# files in a repository. The server answers only to epfl.ch hosts: other
# hosts, local runs off the EPFL network included, show the fallback font.
font-regular: https://enac-it-fonts.epfl.ch/SuisseIntl-Regular-WebS.woff2
font-medium: https://enac-it-fonts.epfl.ch/SuisseIntl-Medium-WebS.woff2
font-bold: https://enac-it-fonts.epfl.ch/SuisseIntl-Bold-WebS.woff2
