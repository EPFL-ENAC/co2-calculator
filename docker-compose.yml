services:
  reverse-proxy:
    image: traefik:v3.6.4
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      # No --api.insecure: the dashboard router below serves api@internal
      # at http://traefik.localhost:8080 only.
      - "--entryPoints.traefik.address=:8833"  # ← isolate the API/dashboard entrypoint
      - "--api.dashboard=true"
      - "--log.level=DEBUG"
      - "--ping=true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=traefik"
    container_name: co2-calculator-traefik
    restart: unless-stopped
    healthcheck:
      # The ping lives on the traefik entrypoint (:8833), not the default :8080.
      test: ["CMD", "traefik", "healthcheck", "--ping", "--entryPoints.traefik.address=:8833"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:8080:8833"
    expose:
      - "80"
      - "8833"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  # PostgreSQL for Auth module
  postgres:
    image: postgres:18-alpine
    container_name: co2-calculator-postgres
    restart: unless-stopped
    env_file:
      - ./.database.env
    ports:
      - "127.0.0.1:5432:5432"
    labels:
      - "traefik.enable=false"
    volumes:
      - postgres-data-18:/var/lib/postgresql
    # 1000-VU load tests (#2295) hit both defaults. Connections: 4 uvicorn
    # workers × (DB_POOL_SIZE + DB_MAX_OVERFLOW) per worker — with this
    # repo's backend/.env (20+10) that is 120 > the old max_connections=100
    # ("too many clients"); the config.py defaults (10+10) give 80, so the
    # ceiling depends on your .env — size it against your own pool values.
    # Shared memory: limit=1000 sorts overflow the 64MB container /dev/shm
    # ("could not resize shared memory segment").
    shm_size: "1gb"
    command: ["postgres", "-c", "listen_addresses=*", "-c", "max_connections=200"]
    healthcheck:
      # Probe its own server, the one that .database.env creates.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 5

  # Opt-in: PGADMIN_DEFAULT_PASSWORD=... docker compose --profile tools up pgadmin
  # No value below: Compose passes your shell's variable, and the image exits
  # without one on a fresh volume. A `:?` check would break every compose run.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: co2-calculator-pgadmin
    profiles: ["tools"]
    restart: always
    labels:
      - "traefik.enable=false"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.org}
      PGADMIN_DEFAULT_PASSWORD:
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: co2-backend
    environment:
      # Local compose only — never True on stage/prod (see app/core/config.py).
      DEBUG: "True"
      # The committed example below, never your backend/.env: that file
      # serves `make dev` and can name a shared database or real services.
      # These win over the example: the app is behind traefik on :80, and
      # the backend must only migrate its own postgres service.
      FRONTEND_URL: "http://localhost"
      DB_URL: "postgresql://co2_user:co2_password@postgres:5432/co2_calculator?sslmode=disable"
      # Empty host: uploads stay in the container (FILES_STORAGE_PATH).
      S3_ENDPOINT_HOSTNAME: ""
      HOST: "0.0.0.0"
      PORT: "8000"
      WORKERS: "1"
    command: >
      sh -c '
        alembic upgrade head &&
        exec opentelemetry-instrument uvicorn app.main:app --host $$HOST --port $$PORT --workers $$WORKERS
      '
    env_file:
      - ./backend/.env.example
    # volumes:
    #   - ./app:/app/app:ro
    labels:
      - "traefik.enable=true"

      # Router
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.routers.backend.priority=200"
      - "traefik.http.routers.backend.middlewares=backend-stripprefix"

      # Middleware
      - "traefik.http.middlewares.backend-stripprefix.stripprefix.prefixes=/api"

      # Service
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s   # give alembic time to run migrations first
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: co2-frontend
    ports:
      - "127.0.0.1:3000:8080"
    # Match the k8s pod's securityContext (readOnlyRootFilesystem: true plus
    # the three emptyDir mounts in helm/templates/frontend-deployment.yaml).
    # Catches read-only-fs regressions locally before they ship to a cluster
    # — see fix(344): write injectEnv.js to /tmp.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    # The institution (#3244): one folder gives the values (values.env) and
    # the files (theme.conf, assets). The container stops without the
    # required values or without theme.conf. To try a real institution, mount
    # its folder instead, and do not commit that change.
    volumes:
      - ./frontend/institution-example:/institution:ro
    environment:
      # No value: Compose passes a variable of your shell, and leaves it out
      # when your shell has none. An empty variable would replace the value
      # of values.env. Same vars the k8s pod receives via frontend.env.
      APP_SENTRY_DSN:
      # "development" adds the /login-test page, the only login without an
      # OIDC provider, and is the GlitchTip label of local runs, apart from
      # the deployed "dev". Same as DEBUG above: local compose only.
      APP_ENVIRONMENT: "${APP_ENVIRONMENT:-development}"
      # Matomo analytics. Without a site id, tracking stays off, so a compose
      # run never sends hits to a real Matomo site by accident.
      APP_MATOMO_URL:
      APP_MATOMO_SITE_ID:
    labels:
      - "traefik.enable=true"
      # match everything else
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=100"
      - "traefik.http.routers.frontend.middlewares=frontend-compress"
      - "traefik.http.middlewares.frontend-compress.compress=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"
    depends_on:
      - backend

  otel:
    image: otel/opentelemetry-collector-contrib:0.86.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    labels:
      - "traefik.enable=false"
    ports:
      - "127.0.0.1:9464:9464"   # Prometheus — host access
      - "127.0.0.1:4317:4317"   # gRPC OTLP — add if you need host access too
    expose:
      - "4317"        # gRPC OTLP — makes it reachable by other containers
      - "4318"        # HTTP OTLP
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro


volumes:
  pgadmin_data:
    driver: local
  postgres-data-18:
    driver: local
